name: MinMaxCal
configs:
  Debug: debug
  Release: release
  AppStore: release
options:
  bundleIdPrefix: com.mikemcquaid
  createIntermediateGroups: true
  defaultConfig: Debug
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "27.0"
  preGenCommand: script/version
packages:
  MinMaxCal:
    path: .
settings:
  base:
    ARCHS: arm64
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_GCD_PERFORMANCE: YES
    CLANG_ANALYZER_LOCALIZABILITY_EMPTY_CONTEXT: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_ANALYZER_OSOBJECT_C_STYLE_CAST: YES
    CLANG_ANALYZER_OTHER_CHECKERS:
      - optin.core
      - optin.cplusplus
      - optin.performance.Padding
      - optin.portability
      - optin.taint
      - security
    CLANG_ANALYZER_OTHER_FLAGS: $(inherited) -analyzer-werror
    CLANG_ANALYZER_SECURITY_BUFFER_OVERFLOW_EXPERIMENTAL: YES
    CLANG_ANALYZER_SECURITY_FLOATLOOPCOUNTER: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_RAND: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_STRCPY: YES
    CLANG_STATIC_ANALYZER_MODE: deep
    CLANG_STATIC_ANALYZER_MODE_ON_ANALYZE_ACTION: deep
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_WARN_INHIBIT_ALL_WARNINGS: NO
    LD_WARN_DUPLICATE_LIBRARIES: YES
    LD_WARN_UNUSED_DYLIBS: YES
    MTL_TREAT_WARNINGS_AS_ERRORS: YES
    OTHER_LDFLAGS: $(inherited) -Wl,-fatal_warnings
    OTHER_SWIFT_FLAGS: $(inherited) -warn-implicit-overrides -Xfrontend -warn-soft-deprecated
    ONLY_ACTIVE_ARCH: YES
    RUN_CLANG_STATIC_ANALYZER: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SUPPRESS_WARNINGS: NO
    SWIFT_STRICT_MEMORY_SAFETY: YES
    SWIFT_SUPPRESS_WARNINGS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    TREAT_MISSING_SCRIPT_PHASE_OUTPUTS_AS_ERRORS: YES
    VALIDATE_PRODUCT: YES
    WARNING_CFLAGS: $(inherited) -Weverything
targets:
  MinMaxCal:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Icons/**
          - Info.plist
          - MinMaxCal.entitlements
      - path: App/Icons/AppIcon.icon
        type: file
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MinMaxCal
        product: MinMaxCalAgenda
      - package: MinMaxCal
        product: MinMaxCalFeatures
      - package: MinMaxCal
        product: MinMaxCalData
      - package: MinMaxCal
        product: MinMaxCalDomain
      - package: MinMaxCal
        product: MinMaxCalIntents
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
      AppStore: Version.xcconfig
    scheme:
      preActions:
        - name: Set version from Git
          settingsTarget: MinMaxCal
          script: '"${PROJECT_DIR}/script/version"'
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/MinMaxCal.entitlements
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.mikemcquaid.MinMaxCal
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: "-"
        AppStore:
          CODE_SIGN_STYLE: Automatic
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APP_STORE
  MinMaxCal-iOS:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
        excludes:
          - Info.plist
      - path: App/Icons/AppIcon.icon
        type: file
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: MinMaxCal-watchOS
        embed: true
      - package: MinMaxCal
        product: MinMaxCalAgenda
      - package: MinMaxCal
        product: MinMaxCalData
      - package: MinMaxCal
        product: MinMaxCalDomain
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: iOSApp/Info.plist
        MARKETING_VERSION: "0.1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.mikemcquaid.MinMaxCal
        PRODUCT_NAME: MinMaxCal
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
  MinMaxCal-watchOS:
    type: application
    platform: watchOS
    sources:
      - path: watchOSApp
        excludes:
          - Info.plist
      - path: App/Icons/AppIcon.icon
        type: file
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MinMaxCal
        product: MinMaxCalAgenda
      - package: MinMaxCal
        product: MinMaxCalData
      - package: MinMaxCal
        product: MinMaxCalDomain
    settings:
      base:
        ARCHS: $(ARCHS_STANDARD)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: watchOSApp/Info.plist
        MARKETING_VERSION: "0.1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.mikemcquaid.MinMaxCal.watchkitapp
        PRODUCT_NAME: MinMaxCal
        SKIP_INSTALL: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
schemes:
  MinMaxCal-watchOS:
    build:
      targets:
        MinMaxCal-watchOS: all
  MinMaxCal-iOS:
    build:
      targets:
        MinMaxCal-iOS: all
    archive:
      config: AppStore
  MinMaxCal-AppStore:
    build:
      targets:
        MinMaxCal: all
      preActions:
        - name: Set version from Git
          settingsTarget: MinMaxCal
          script: '"${PROJECT_DIR}/script/version"'
    run:
      config: AppStore
    profile:
      config: AppStore
    analyze:
      config: AppStore
    archive:
      config: AppStore
