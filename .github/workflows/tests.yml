name: GitHub Actions CI

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash -xeuo pipefail {0}

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - name: Bootstrap
        run: script/bootstrap

      - name: Check style
        run: script/style

  tests:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The build number counts the commits.
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - name: Select Xcode 27
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*27*.app' -print -quit)"
          if [[ -z "${xcode}" ]]; then
            echo "::error::Xcode 27 is not installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version

      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift package dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build/checkouts
            .build/repositories
            .build/DerivedData/SourcePackages/checkouts
            .build/DerivedData/SourcePackages/repositories
          key: ${{ runner.os }}-swiftpm-tests-${{ hashFiles('Package.swift', 'Package.resolved', 'MinMaxCal.xcodeproj/project.xcproj') }}
          restore-keys: ${{ runner.os }}-swiftpm-tests-

      - name: Bootstrap
        run: script/bootstrap

      - name: Build
        run: script/build

      - name: Build iOS and watchOS
        run: >-
          xcodebuild -project MinMaxCal.xcodeproj -scheme MinMaxCal-iOS
          -configuration Debug -destination 'generic/platform=iOS'
          -derivedDataPath .build/iOS CODE_SIGNING_ALLOWED=NO build

      - name: Test
        run: script/test

      - name: Test with Address Sanitizer
        env:
          ASAN_OPTIONS: halt_on_error=1
        run: script/test --sanitize address --scratch-path .build/address-sanitizer

      - name: Test with Thread Sanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: script/test --sanitize thread --scratch-path .build/thread-sanitizer

      - name: Render icons
        run: script/icons

  analyze:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - name: Select Xcode 27
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*27*.app' -print -quit)"
          if [[ -z "${xcode}" ]]; then
            echo "::error::Xcode 27 is not installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version

      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift package dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-analyze-${{ hashFiles('Package.swift', 'Package.resolved', 'MinMaxCal.xcodeproj/project.xcproj') }}
          restore-keys: ${{ runner.os }}-swiftpm-analyze-

      - name: Bootstrap
        run: script/bootstrap

      - name: Analyze
        run: script/analyze

# `style`, `tests` and `analyze` always run, so they are the required
# checks in branch protection directly. If any job ever becomes
# conditionally skipped (a job-level `if:`, a path filter, or a
# matrix), add back an aggregating `check` job with `if: always()`
# that fails unless every `needs` job succeeded and require that
# instead: branch protection handles a skipped required-by-name check
# poorly.
